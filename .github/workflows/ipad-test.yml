name: iPad compatibility screenshots
run-name: iPad compatibility test
on:
  workflow_dispatch:
  push:
    branches: [ipad-test]

permissions:
  contents: read

jobs:
  ipad:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Newest stable Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Build web content and iOS project (same steps as TestFlight)
        run: |
          set -euo pipefail
          npm ci
          npx cap add ios --packagemanager CocoaPods
          python3 tools/ios_setup.py
      - name: iPhone-only (as the App Store build) and no ads in this disposable build
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = re.sub(r'TARGETED_DEVICE_FAMILY = [^;]+;', 'TARGETED_DEVICE_FAMILY = 1;', s)
          p.write_text(s)
          stub = pathlib.Path('../.github/ipad-test/adstub.js').read_text()
          for f in pathlib.Path('ios/App/App/public').rglob('ads.js'):
              f.write_text(stub); print('stubbed', f)
          PY
          grep -c 'TARGETED_DEVICE_FAMILY = 1;' ios/App/App.xcodeproj/project.pbxproj
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"; echo "TEST_APP=$APP" >> "$GITHUB_ENV"
      - name: Boot iPad Air 11-inch
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          j = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          c = []
          for rt, items in j['devices'].items():
              for d in items:
                  n = d['name']
                  if n.startswith('iPad'):
                      c.append((('iPad Air' in n and '11-inch' in n and 'M4' in n), ('iPad Air' in n and '11-inch' in n), 'iPad Air' in n, rt, n, d['udid']))
          c.sort(reverse=True)
          print('Selected:', c[0][4], c[0][3], file=sys.stderr)
          print(c[0][5])
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
      - name: Screenshots (one fresh launch per screen)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          BID=com.flixtoys.arkana
          xcrun simctl install "$UDID" "$TEST_APP"
          INST=$(xcrun simctl get_app_container "$UDID" $BID app)
          cp "$INST/public/index.html" "$RUNNER_TEMP/base.html"
          mkdir -p "$GITHUB_WORKSPACE/shots"
          xcrun simctl status_bar "$UDID" override --time '9:41' --batteryState charged --batteryLevel 100 || true
          for stage in home play menu2; do
            STAGE=$stage INST="$INST" python3 - <<'PY'
          import os, pathlib
          base = pathlib.Path(os.environ['RUNNER_TEMP'], 'base.html').read_text(encoding='utf-8')
          probe = pathlib.Path('../.github/ipad-test/probe.js').read_text().replace('__STAGE__', os.environ['STAGE'])
          i = base.rfind('</body>')
          html = base[:i] + '<script>' + probe + '</script>' + base[i:] if i >= 0 else base + '<script>' + probe + '</script>'
          pathlib.Path(os.environ['INST'], 'public', 'index.html').write_text(html, encoding='utf-8')
          PY
            t 60 xcrun simctl terminate "$UDID" $BID || true
            sleep 2
            t 180 xcrun simctl launch "$UDID" $BID
            sleep 16
            t 120 xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/shots/$stage-a.png"
            sleep 8
            t 120 xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/shots/$stage-b.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screenshots
          path: shots/*.png
          retention-days: 7
