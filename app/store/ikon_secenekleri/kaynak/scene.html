// ---------- FLIX ----------
const HS = new THREE.Vector3(1.08, 0.96, 1);

    add(e, new THREE.SphereGeometry(0.018, 12, 8), new THREE.MeshBasicMaterial({color: 0xffffff, toneMapped: false}), pu.position.x - 0.03, pu.position.y - 0.06, 0.225);

// ---------- world (layer BG) ----------
function canvasTex(w, h, fn, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); } return t; }

// zoom blur of the background
